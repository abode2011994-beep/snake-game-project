<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNAKE GAME</title>
    <link rel="stylesheet" href="style.css">
   
</head>

<body>
    <h1>SNAKE GAME</h1>

    <div id="menu">
        <h2>Welcome!</h2>
        <p>Choose your difficulty</p>

        <button id="playButton">PLAY</button>

        <div id="difficulty">
            <h3>Select Difficulty</h3>
            <button id="easyButton">Easy</button>
            <button id="mediumButton">Medium</button>
            <button id="hardButton">Hard</button>
        </div>

        <div id="leaderBoard">
            <h3>LEADERBOARD</h3>

            <input
               type="text"
               id="playerName"
               placeholder="Enter your name"
               maxlength="12"
            >

            <ol id="leaderboardList">
                <li>No scores yet!</li>
            </ol>

        </div>
        <button id="statsButton">STATISTICS</button>

    </div>

    <div id="gameContainer" style="display: none;">
        
        <canvas id="board"></canvas>

        <p>Arrow keys   or wipe to move &middot; Press P to paused</p>
        
        <button id="pauseButton">PAUSE</button>

        <div id="gameOverScreen" style="display: none;">

            <h2>GAME OVER</h2>

            <p>Final Score: <span id="finalScore">0</span></p>

            <p>High Score: <span id="finalHighScore">0</span></p>

            <button id="playAgainButton">PLAY AGAIN</button>

            <button id="menuButton">MAIN MENU</button>
        </div>
    </div>

    <div id="statsScreen" style="display: none;">
        <h2>STATISTICS</h2>

        <div class="statBox">
            <h3>Games PLayed</h3>
            <p id="gamesPlayed">0</p>
        </div>

        <div class="statBox">
            <h3>Best Score</h3>
            <p id="bestScore">0</p>
        </div>

        <div class="statBox">
            <h3>Average Score</h3>
            <p id="averageScore">0</p>
        </div>

        <div class="statBox">
            <h3>Total Food Eaten</h3>
            <p id="totalFood">0</p>
        </div>

        <button id="backToMenuButton">BACK TO MENU</button>
    </div>

     <script src="script.js"></script>
</body>
</html>
